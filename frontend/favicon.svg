<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Fatia 1 (Esquerda: Verde Menta Claro -> Verde Studio Lime -> Esmeralda) -->
    <linearGradient id="cmFavSlice1" x1="16" y1="6" x2="32" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#76FFB4"/>
      <stop offset="30%" stop-color="#00F076"/>
      <stop offset="70%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gradiente Fatia 2 (Centro: Menta Neon -> Studio Lime -> Jade Profundo) -->
    <linearGradient id="cmFavSlice2" x1="44" y1="8" x2="55" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="25%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#00F076"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>

    <!-- Gradiente Fatia 3 (Ponta: Esmeralda Elétrico -> Studio Lime -> Verde Floresta) -->
    <linearGradient id="cmFavSlice3" x1="68" y1="20" x2="88" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="35%" stop-color="#00F076"/>
      <stop offset="75%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Brilho Neon na Lâmina 2 -->
    <linearGradient id="cmFavBlade2" x1="44" y1="7" x2="32" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00F076" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Brilho Neon na Lâmina 3 -->
    <linearGradient id="cmFavBlade3" x1="71" y1="21" x2="59" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#A7F3D0" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#00F076" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Fatia 1 (Base Esquerda) -->
  <path d="M 18 6.5 C 13 6.5 10 10 10 16 L 10 83 C 10 88.5 13 92 18.5 92 C 22 92 25.5 90 28 87.5 L 38.5 18.5 C 39.5 16 38 14 35.5 13 L 23 7.5 C 21.5 6.8 19.8 6.5 18 6.5 Z" fill="url(#cmFavSlice1)"/>

  <!-- Fatia 2 (Lâmina Central Dinâmica) -->
  <path d="M 44.5 7.5 L 43.5 17 L 33 84 L 32 95 L 37 84 L 56.5 72 L 65.5 30.5 L 46.5 19.5 L 44.5 7.5 Z" fill="url(#cmFavSlice2)"/>
  <path d="M 44.5 7.5 L 32 95" stroke="url(#cmFavBlade2)" stroke-width="2" stroke-linecap="round"/>

  <!-- Fatia 3 (Ponta Apex Dinâmica) -->
  <path d="M 71.5 21 L 70.5 31 L 61 74 L 59.5 84 L 66.5 68 L 86.5 56.5 C 89.5 54 89.5 48 86.5 45.3 L 72.5 33.5 L 71.5 21 Z" fill="url(#cmFavSlice3)"/>
  <path d="M 71.5 21 L 59.5 84" stroke="url(#cmFavBlade3)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
