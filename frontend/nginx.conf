server {
    listen 80;
    server_name localhost;

    # Oculta versão do Nginx (S6.3)
    server_tokens off;

    # Limite global de payload para prevenir DoS (S5.5 / S6.3)
    client_max_body_size 1M;

    # Headers de Segurança
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com;" always;

    # Compactação Gzip para alta performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Cache longo e imutável para assets estáticos versionados (css, js, fontes, svg, ico)
    location ~* \.(css|js|woff2?|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html sempre validado para refletir novas versões de script
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Entrega dos arquivos estáticos do Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de integridade direto
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Entrega acelerada e eficiente de vídeos via X-Accel-Redirect
    # Protegido contra acesso direto pelo cliente (apenas requisições internas da API)
    location /internal_videos/ {
        internal;
        alias /var/lib/clipmaker/videos/;

        # Cache de metadados e descritores de arquivos abertos
        open_file_cache max=1000 inactive=120s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;

        # Suporte nativo a HTTP Range (status 206 Partial Content) para seek suave no player HTML5
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-transform, max-age=86400" always;
    }

    # Uploads de vídeo: exceção de payload para suportar arquivos de até 2GB (S5.5)
    location ~ ^/api/(v1/)?videos?/upload {
        client_max_body_size 2000M;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires off;
    }

    # Proxy reverso para a API FastAPI (limite padrão 1M ativo para prevenir DoS)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;

        # Desabilitar cache de respostas dinâmicas da API
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires off;
    }
}
