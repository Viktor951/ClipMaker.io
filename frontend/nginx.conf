server {
    listen 80;
    server_name localhost;

    # Headers de Segurança
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compactação Gzip para alta performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;

    # Entrega dos arquivos estáticos do Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de integridade direto
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Entrega acelerada e eficiente de vídeos via X-Accel-Redirect
    # Protegido contra acesso direto pelo cliente (apenas requisições internas da API)
    location /internal_videos/ {
        internal;
        alias /var/lib/clipmaker/videos/;

        # Cache de metadados e descritores de arquivos abertos
        open_file_cache max=1000 inactive=120s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;

        # Suporte nativo a HTTP Range (status 206 Partial Content) para seek suave no player HTML5
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-transform, max-age=86400" always;
    }

    # Proxy reverso para a API FastAPI
    location /api/ {
        client_max_body_size 2000M;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;

        # Desabilitar cache de respostas dinâmicas da API
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires off;
    }
}
