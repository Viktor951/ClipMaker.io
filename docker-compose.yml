# ==============================================================================
# ClipMakerAI — Docker Compose para Desenvolvimento Local
# ==============================================================================
# RAM TOTAL MÁXIMA PERMITIDA: ~3.5GB (soma de todos os limites)
#
# Breakdown dos limites:
#   db       → 256MB   (Postgres com shared_buffers reduzido)
#   redis    → 128MB   (maxmemory explícito + eviction policy)
#   api      → 512MB   (Uvicorn 1 worker, sem Gunicorn)
#   frontend → 64MB    (Nginx estático)
#   worker   → 2GB     (Whisper + FFmpeg + OpenCV — o mais pesado)
#   cleanup  → 64MB    (Script Python puro)
# ==============================================================================

services:
  # ── BANCO DE DADOS ────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-clipmaker_db}
    # shared_buffers=64MB e work_mem=4MB reduzem drasticamente a RAM do Postgres.
    # O padrão é 128MB/4MB, mas para dev local com poucos usuários isso é suficiente.
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c effective_cache_size=128MB
      -c max_connections=20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── CACHE / FILA ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # maxmemory 64mb: Redis NUNCA passará de 64MB.
    # allkeys-lru: Quando cheio, expulsa as chaves menos usadas automaticamente.
    # save "": Desativa persistência em disco (desnecessário para fila de tarefas).
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  # ── API (FastAPI) ─────────────────────────────────────────────────────────
  api:
    build: .
    # --workers 1: Crítico. Cada worker adicional do Uvicorn é um processo
    # Python separado que duplica toda a memória base (~100MB por worker).
    # --reload: Hot-reload para desenvolvimento.
    # --limit-concurrency 30: Limita requests simultâneos para evitar OOM.
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --workers 1
      --limit-concurrency 30
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/clipmaker_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── FRONTEND (Nginx) ─────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

  # ── WORKER (Huey + Whisper + FFmpeg) ──────────────────────────────────────
  # Este é o container mais pesado: roda Whisper (IA), OpenCV (face tracking)
  # e FFmpeg (render). O limite de 2GB é o mínimo viável.
  worker:
    build: .
    # -w 1: Um único worker process. CRÍTICO para RAM.
    # -k thread: Usa threads em vez de processos — compartilham memória base.
    command: huey_consumer backend.app.worker.worker.huey -w 1 -k thread
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/clipmaker_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - redis
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"

  # ── CLEANUP (Limpeza de arquivos temporários) ─────────────────────────────
  # Ao invés de buildar a imagem Python completa (~800MB) só pra rodar um
  # script de 29 linhas, usamos uma imagem Alpine pura (~7MB).
  cleanup:
    image: alpine:3.19
    command: sh -c "while true; do find /app/backend/temp_videos -type f -mmin +1440 -delete 2>/dev/null; echo '[CLEANUP] Rotina concluída'; sleep 3600; done"
    volumes:
      - ./backend/temp_videos:/app/backend/temp_videos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.05"

volumes:
  postgres_data: