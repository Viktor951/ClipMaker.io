name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: clipmaker_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Initialize Database
      run: |
        PGPASSWORD=password psql -h localhost -U postgres -d clipmaker_db_test -f init.sql
        
    - name: Run Tests
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/clipmaker_db_test
        SECRET_KEY: test_secret_key_only
        ENVIRONMENT: test
      run: |
        pytest -v
