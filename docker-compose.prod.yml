# ==============================================================================
# ClipMakerAI — Docker Compose de PRODUÇÃO
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Dados persistentes em D: (DATA_ROOT, padrão D:/docker-data/clipmaker):
#   videos/  -> uploads e clipes renderizados (compartilhado api + worker)
#   cache/   -> modelos Whisper (HuggingFace) e cache do yt-dlp
#   logs/    -> reservado para logs em arquivo (logs padrão vão para stdout)
#   redis/   -> fila de tarefas (AOF)
#   caddy/   -> certificados TLS
# Postgres usa volume nomeado (ver README-DEPLOY.md: bind mount NTFS quebra o initdb).
# ==============================================================================

name: clipmaker-prod

x-app-env: &app-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ALLOWED_ORIGINS: https://${DOMAIN:-localhost}
  LOG_FORMAT: json

x-app-volumes: &app-volumes
  - ${DATA_ROOT:-D:/docker-data/clipmaker}/videos:/app/backend/temp_videos
  - ${DATA_ROOT:-D:/docker-data/clipmaker}/cache:/app/cache
  - ${DATA_ROOT:-D:/docker-data/clipmaker}/logs:/app/logs

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ── BANCO ─────────────────────────────────────────────────────────────────
  db:
    <<: *hardening
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c effective_cache_size=384MB
      -c max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SEM "ports": o banco só é acessível pela rede interna do compose.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MIGRAÇÕES (one-shot, a cada deploy) ───────────────────────────────────
  migrate:
    image: postgres:15-alpine
    entrypoint: ["sh", "/scripts/migrate.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 64m

  # ── REDIS (fila Huey) ─────────────────────────────────────────────────────
  redis:
    <<: *hardening
    image: redis:7-alpine
    # AOF: tarefas enfileiradas sobrevivem a reinícios. Com senha.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - ${DATA_ROOT:-D:/docker-data/clipmaker}/redis:/data
    restart: unless-stopped
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    mem_limit: 192m
    cpus: 0.3
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    image: clipmakerai:prod
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    # healthcheck herdado do Dockerfile (GET /health)

  # ── WORKER (Huey + Whisper + FFmpeg) ──────────────────────────────────────
  worker:
    <<: *hardening
    image: clipmakerai:prod
    command: huey_consumer backend.app.worker.worker.huey -w 1 -k thread
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── CLEANUP ───────────────────────────────────────────────────────────────
  cleanup:
    <<: *hardening
    image: clipmakerai:prod
    command: sh -c "while true; do python scripts/cleanup.py; sleep 3600; done"
    volumes:
      - ${DATA_ROOT:-D:/docker-data/clipmaker}/videos:/app/backend/temp_videos
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    healthcheck:
      disable: true

  # ── REVERSE PROXY (TLS + zstd/gzip + frontend estático) ───────────────────
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - ${DATA_ROOT:-D:/docker-data/clipmaker}/caddy/data:/data
      - ${DATA_ROOT:-D:/docker-data/clipmaker}/caddy/config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
