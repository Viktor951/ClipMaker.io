# ==============================================================================
# ClipMakerAI — Docker Compose de PRODUÇÃO
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Estratégia de Armazenamento:
#   - clipmaker_temp_videos (volume nomeado Docker): área de trabalho efêmera
#     (uploads e clipes) com I/O nativo ext4 rápido, compartilhado entre api, worker e cleanup.
#   - D: (DATA_ROOT, padrão D:/docker-data/clipmaker):
#       cache/   -> modelos Whisper (HuggingFace) e cache do yt-dlp
#       logs/    -> reservado para logs persistentes
#       redis/   -> fila de tarefas (AOF)
#   - postgres_data: volume nomeado para estabilidade do PostgreSQL.
# ==============================================================================

name: clipmaker-prod

x-app-env: &app-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ALLOWED_ORIGINS: http://${DOMAIN:-localhost},https://${DOMAIN:-localhost}
  LOG_FORMAT: json
  MAX_SOURCE_HEIGHT: ${MAX_SOURCE_HEIGHT:-1080}
  USE_NGINX_ACCEL: "true"

x-app-volumes: &app-volumes
  - clipmaker_temp_videos:/app/backend/temp_videos
  - ${DATA_ROOT:-D:/docker-data/clipmaker}/cache:/app/cache
  - ${DATA_ROOT:-D:/docker-data/clipmaker}/logs:/app/logs

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ── BANCO ─────────────────────────────────────────────────────────────────
  db:
    <<: *hardening
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c effective_cache_size=384MB
      -c max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MIGRAÇÕES (one-shot, a cada deploy) ───────────────────────────────────
  migrate:
    image: postgres:15-alpine
    entrypoint: ["sh", "/scripts/migrate.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 64m

  # ── REDIS (fila Huey) ─────────────────────────────────────────────────────
  redis:
    <<: *hardening
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --rename-command CONFIG ""
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
    volumes:
      - ${DATA_ROOT:-D:/docker-data/clipmaker}/redis:/data
    restart: unless-stopped
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    mem_limit: 192m
    cpus: 0.3
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: clipmakerai:prod
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0

  # ── WORKER (Huey + Whisper CPU + FFmpeg) ─────────────────────────────────
  # ESCALABILIDADE DE WORKERS (Fila unificada):
  # - Subir mais de uma réplica do worker:
  #     docker compose -f docker-compose.prod.yml up -d --scale worker=2
  # - Definir quantas threads cada réplica usa:
  #     Ajuste o parâmetro -w <N> no comando abaixo (ex.: -w 1 -k thread).
  #     Recomendado: 1 worker process com 1-2 threads para respeitar CPU/memória e evitar contenção.
  # - Fila unificada: backend.app.worker.worker.huey processa todas as tarefas unificadas (ingestão, transcrição e render).
  # - Suporte a GPU NVIDIA: use o override com docker-compose.gpu.yml:
  #     docker compose -f docker-compose.prod.yml -f docker-compose.gpu.yml up -d --build
  worker:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: clipmakerai:prod
    command: huey_consumer backend.app.worker.worker.huey -w 1 -k thread
    environment:
      <<: *app-env
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_IDLE_TIMEOUT_MINUTES: ${WHISPER_IDLE_TIMEOUT_MINUTES:-15}
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    cpus: ${WORKER_CPUS:-4.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── CLEANUP ───────────────────────────────────────────────────────────────
  cleanup:
    <<: *hardening
    image: clipmakerai:prod
    command: sh -c "while true; do python scripts/cleanup.py; sleep 3600; done"
    volumes:
      - clipmaker_temp_videos:/app/backend/temp_videos
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    healthcheck:
      disable: true

  # ── FRONTEND & REVERSE PROXY (Nginx) ──────────────────────────────────────
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - clipmaker_temp_videos:/var/lib/clipmaker/videos:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  clipmaker_temp_videos:
