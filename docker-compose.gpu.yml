# ==============================================================================
# ClipMakerAI — Docker Compose Override para Aceleração por GPU NVIDIA
# Uso com GPU:
#   docker compose -f docker-compose.prod.yml -f docker-compose.gpu.yml up -d --build
# ==============================================================================

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-gpu
    image: clipmakerai:prod-gpu
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
